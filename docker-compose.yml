services:
  db:
    image: mariadb:12
    environment:
      MYSQL_DATABASE: urcast_db
      MYSQL_USER: urcast
      MYSQL_PASSWORD: urcast
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - urcast-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: uv run fastapi dev main.py --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: mysql+pymysql://urcast:urcast@db:3306/urcast_db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

volumes:
  urcast-db-data:
