<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>UrCast</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- Montserrat Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap"
          rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon"
          href="{{ url_for('static', path='icons/favicon.ico') }}"
          sizes="any">

    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        font-family: 'Montserrat', sans-serif;
      }
      .logo {
        width: 250px;
        height: auto;
        /* margin-bottom: -3rem */
      }
      .btn-docs {
        --bs-btn-font-weight: 600;
        --bs-btn-border-radius: 0.5rem;
      }
      .logo-light {
        display: none;
      }
      [data-bs-theme="light"] .logo-light {
        display: inline;
      }
      [data-bs-theme="light"] .logo-dark {
        display: none;
      }
    </style>

    <script>
      const setTheme = (theme) => {
        const resolved = theme === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : theme;
        document.documentElement.setAttribute('data-bs-theme', resolved);
      };
      setTheme(localStorage.getItem('theme') || 'auto');
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if ((localStorage.getItem('theme') || 'auto') === 'auto') setTheme('auto');
      });
    </script>
  </head>
  <body data-bs-theme="auto">
    <main class="text-center px-3">
      <img class="logo logo-light" src="{{ url_for('static', path='icons/urcast_logo_light.svg') }}" alt="UrCast logo">
      <img class="logo logo-dark" src="{{ url_for('static', path='icons/urcast_logo_dark.svg') }}" alt="UrCast logo">
      <h1 class="mb-4">Welcome to <strong>urcast.</strong></h1>
      <a class="btn btn-outline-secondary btn-lg btn-docs mb-3" href="{{ url_for('swagger_ui_html') }}">View the API Docs</a>
      <hr class="pb-3">
      <h4 class="mb-4">Looking for the app? Download it below:</h3>
      <a class="btn btn-outline-primary btn-lg btn-docs mb-3" target="_blank" href="https://github.com/urcast/urcast-client">urcast. App Download</a>
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
  </body>
</html>
